# try_files falls back to index.html for any path that isn't a real static
# file, so client-side routes (e.g. /shop, /product/xyz) work on a hard
# refresh instead of nginx 404ing on paths React Router owns, not nginx.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mirrors the /api/ proxy the VPS-level nginx does in production (see
    # infra/nginx) - without this, `docker compose up` alone can't serve a
    # working app locally, only `npm run dev` (whose Vite proxy, see
    # vite.config.ts, covers the same gap for local dev).
    location /api/ {
        proxy_pass http://backend:8094/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
