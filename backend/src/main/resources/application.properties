spring.application.name=backend

# Postgres connection. Defaults point at a local instance so the app also runs
# outside docker-compose (e.g. a Postgres started manually on the dev machine);
# docker-compose overrides all of these via env vars (see docker-compose.yml).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:almo}
spring.datasource.username=${DB_USER:almo}
spring.datasource.password=${DB_PASSWORD:almo}

# Schema is owned by Flyway migrations, not Hibernate. "validate" makes Hibernate
# fail fast if an entity doesn't match the actual schema, instead of silently
# altering tables (which "update"/"create" would do).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis backs Spring Session so logged-in users survive a backend
# restart/redeploy instead of being logged out (see spec decision on session store).
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.session.store-type=redis
# Indexed (not the "default" simple repository) so AuthService.deleteStaff can look up and kill a
# removed staff member's active sessions by principal name - otherwise deleting their account
# leaves their existing session (and admin access) valid until it naturally expires. Verified the
# actual property key against SessionDataRedisAutoConfiguration's bytecode (Spring Boot 4.1.1) -
# the "spring.session.redis.*" spelling in the configuration-metadata docs is a deprecated alias
# that the @ConditionalOnProperty here does NOT read; only this "data.redis" spelling does.
spring.session.data.redis.repository-type=indexed

# 8094 matches the port nginx proxies /api/ to on the VPS (see infra/nginx).
server.port=${SERVER_PORT:8094}

# Session cookie, per spec: SameSite=Lax + Secure. Secure requires HTTPS, which only exists
# behind nginx on the VPS - override to false in a local .env for plain-HTTP dev (see
# infra/.env.example). Defaults to true so nobody has to remember to set it in production.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}

# Brevo transactional email (password reset link). Empty key = BrevoMailService logs instead of
# sending, see infra/.env.example.
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:no-reply@almo-group.vn-nspace.de}
brevo.sender-name=${BREVO_SENDER_NAME:Almo Schmuck}

# Frontend origin the password-reset link points at (not the API) and how long that link stays
# valid - see Sprint 1 decision in docs/backlog.md.
app.auth.frontend-url=${FRONTEND_URL:http://localhost:8093}
app.auth.password-reset-token-ttl-minutes=60

# Where new-order notifications go and what the order PDF tells customers to use if the admin
# doesn't reach out first. Placeholder defaults - see Sprint 4 decision in docs/backlog.md.
app.shop.contact-email=${ADMIN_EMAIL:orders@almo-group.vn-nspace.de}
app.shop.contact-whatsapp=${ADMIN_WHATSAPP:+49 000 0000000}
