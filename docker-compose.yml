# Local/VPS runtime stack. Copy infra/.env.example to .env next to this file
# and adjust before running `docker compose up`.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-almo}
      POSTGRES_USER: ${DB_USER:-almo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-almo}
    volumes:
      - almo_pgdata:/var/lib/postgresql/data
    # No "ports:" on purpose: only other containers on almo_internal can reach
    # Postgres, not the host or the outside world (matches how nspace-postgres
    # is set up on the shared VPS, see spec).
    networks:
      - almo_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Same reasoning as db: internal-only, backend reaches it by service name.
    networks:
      - almo_internal

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-almo}
      DB_USER: ${DB_USER:-almo}
      DB_PASSWORD: ${DB_PASSWORD:-almo}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8094
      # true by default (safe for the VPS, which is always fronted by TLS via nginx); set
      # COOKIE_SECURE=false in your local .env for plain-HTTP dev, see infra/.env.example.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8093}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-no-reply@almo-group.vn-nspace.de}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Almo Schmuck}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-orders@almo-group.vn-nspace.de}
      ADMIN_WHATSAPP: ${ADMIN_WHATSAPP:-+49 000 0000000}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
    # Bound to 127.0.0.1 only: reachable from this machine and from nginx
    # (which also runs on the host), never directly from the internet - nginx
    # is the only public entry point, see infra/nginx.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8094}:8094"
    networks:
      - almo_internal

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8093}:80"
    networks:
      - almo_internal

networks:
  almo_internal:
    driver: bridge

volumes:
  almo_pgdata:
