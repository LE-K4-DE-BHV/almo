name: CI

# Runs on every push to main and on every PR, so a broken build/format/lint is
# caught before it lands. Only the lint/build stage exists so far (Sprint 0);
# test/e2e/security-scan/deploy stages get added in later sprints per the spec's
# CI/CD section and docs/backlog.md.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # tsc -b (type-check) + vite build catches type errors lint doesn't.
      - run: npm run build

  lint-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Fails the build on formatting drift instead of auto-fixing in CI -
      # contributors run `./mvnw spotless:apply` locally before pushing.
      - run: ./mvnw -B spotless:check
      - run: ./mvnw -B compile
