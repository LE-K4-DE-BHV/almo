<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wunschliste &mdash; Almo Schmuck</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/footer.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div id="site-header"></div>

<section class="section">
  <div class="wrap">
    <div class="section-head">
      <h2 id="page-title"></h2>
    </div>
    <div id="wishlist-root"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/i18n.js"></script>
<script src="js/products.js"></script>
<script src="js/products-i18n.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/recently-viewed.js"></script>
<script src="js/main.js"></script>
<script>
  renderHeader();
  renderFooter();
  document.title = t("wishlist_page_title") + " — Almo Schmuck";
  document.getElementById("page-title").textContent = t("wishlist_page_title");

  function renderWishlistPage() {
    const root = document.getElementById("wishlist-root");
    const ids = getWishlist();
    const products = ids.map(getProductById).filter(Boolean);

    if (products.length === 0) {
      root.innerHTML = `
        <div class="empty-state">
          <h2>${t("wishlist_empty_title")}</h2>
          <p>${t("wishlist_empty_text")}</p>
          <a href="shop.html" class="btn">${t("shop_now")}</a>
        </div>`;
      return;
    }

    root.innerHTML = `<div class="product-grid">${products.map(renderProductCard).join("")}</div>`;
    updateWishlistBadge();
  }

  renderWishlistPage();
</script>
</body>
</html>
