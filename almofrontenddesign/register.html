<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrieren &mdash; Almo Schmuck</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/footer.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div id="site-header"></div>

<div class="auth-wrap">
  <h1 id="register-title"></h1>
  <p class="sub" id="register-sub"></p>
  <div class="auth-error" id="auth-error" hidden></div>
  <form id="register-form">
    <div class="field">
      <label for="name" id="name-label"></label>
      <input type="text" id="name" required autocomplete="name">
    </div>
    <div class="field">
      <label for="email" id="email-label"></label>
      <input type="email" id="email" required autocomplete="email">
    </div>
    <div class="field">
      <label for="password" id="password-label"></label>
      <input type="password" id="password" required autocomplete="new-password" minlength="4">
    </div>
    <button type="submit" class="btn btn-block" id="register-btn"></button>
  </form>
  <p class="auth-switch"><span id="have-account"></span> <a href="login.html" id="login-now"></a></p>
</div>

<div id="site-footer"></div>

<script src="js/i18n.js"></script>
<script src="js/products.js"></script>
<script src="js/products-i18n.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/recently-viewed.js"></script>
<script src="js/main.js"></script>
<script>
  renderHeader();
  renderFooter();

  document.title = t("register_title") + " — Almo Schmuck";
  document.getElementById("register-title").textContent = t("register_title");
  document.getElementById("register-sub").textContent = t("register_sub");
  document.getElementById("name-label").textContent = t("name_label");
  document.getElementById("email-label").textContent = t("email_label");
  document.getElementById("password-label").textContent = t("password_label");
  document.getElementById("register-btn").textContent = t("register_btn");
  document.getElementById("have-account").textContent = t("have_account");
  document.getElementById("login-now").textContent = t("login_now");

  document.getElementById("register-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const errorBox = document.getElementById("auth-error");

    if (!name || !email || password.length < 4) {
      errorBox.textContent = t("auth_error");
      errorBox.hidden = false;
      return;
    }

    const result = registerUser(name, email, password);
    if (!result.ok) {
      errorBox.textContent = t("register_error_exists");
      errorBox.hidden = false;
      return;
    }

    window.location.href = "account.html";
  });
</script>
</body>
</html>
