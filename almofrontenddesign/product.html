<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Produkt &mdash; Almo Schmuck</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/footer.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div id="site-header"></div>

<section class="section" style="padding-top:32px">
  <div class="wrap">
    <div class="breadcrumb" id="breadcrumb"></div>
    <div id="product-root"></div>
  </div>
</section>

<section class="section" style="padding-top:0" id="related-section">
  <div class="wrap">
    <div class="section-head">
      <h2 id="related-title"></h2>
    </div>
    <div class="product-grid" id="related-grid"></div>
  </div>
</section>

<section class="section" style="padding-top:0" id="recent-section" hidden>
  <div class="wrap">
    <div class="section-head">
      <h2 id="recent-title"></h2>
    </div>
    <div class="product-grid" id="recent-grid"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/i18n.js"></script>
<script src="js/products.js"></script>
<script src="js/products-i18n.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/recently-viewed.js"></script>
<script src="js/main.js"></script>
<script>
  renderHeader();
  renderFooter();
  document.getElementById("related-title").textContent = t("related_title");
  document.getElementById("recent-title").textContent = t("recently_viewed_title");

  const product = getProductById(qs("id"));
  const root = document.getElementById("product-root");

  if (!product) {
    root.innerHTML = `<div class="empty-state"><h2>${t("product_not_found")}</h2><a href="shop.html" class="btn">${t("back_to_shop")}</a></div>`;
    document.getElementById("related-section").hidden = true;
  } else {
    const text = getProductText(product);
    document.title = product.name + " — Almo Schmuck";
    document.getElementById("breadcrumb").innerHTML =
      `<a href="index.html">${t("breadcrumb_home")}</a> / <a href="shop.html?category=${encodeURIComponent(product.category)}">${text.category}</a> / ${product.name}`;

    const stock = stockLabel(product.stock);
    const inWishlist = isInWishlist(product.id);

    root.innerHTML = `
      <div class="product-detail">
        <div>
          <div class="product-detail-media">
            <img id="main-image" src="${product.images[0]}" alt="${product.name}" style="width:100%;height:100%;object-fit:cover">
          </div>
          ${product.images.length > 1 ? `
            <div class="gallery-thumbs">
              ${product.images.map((img, i) => `<img src="${img}" class="${i === 0 ? "active" : ""}" data-thumb="${i}" alt="${product.name}">`).join("")}
            </div>` : ""}
        </div>
        <div class="product-detail-info">
          <div class="category">${text.category}</div>
          <h1>${product.name}</h1>
          <div class="rating-large">
            <span class="stars">${renderStars(product.rating)}</span>
            <span>${product.rating.toFixed(1)} &middot; ${product.reviewCount} ${t("reviews")}</span>
          </div>
          ${renderPriceRow(product)}
          <div class="stock-badge ${stock.cls}">${t(stock.key)}</div>
          <p class="desc">${text.description}</p>

          <form class="add-to-cart-form" id="add-form">
            <div class="qty-row">
              <div class="qty-stepper">
                <button type="button" id="qty-minus">&minus;</button>
                <input type="number" id="qty-input" value="1" min="1" readonly>
                <button type="button" id="qty-plus">&plus;</button>
              </div>
              <button type="submit" class="btn">${t("add_to_cart")}</button>
            </div>
            <div class="form-msg" id="form-msg"></div>
          </form>

          <button type="button" class="wishlist-btn-large ${inWishlist ? "active" : ""}" id="wishlist-large-btn" style="margin-top:16px">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 2.5 5 6 5c2 0 3.5 1 4.5 2.5C11.5 6 13 5 15 5c3.5 0 5.5 3.5 3.5 7.5C19 16.65 12 21 12 21z"/></svg>
            <span id="wishlist-large-label">${inWishlist ? t("wishlist_on_list") : t("wishlist_add")}</span>
          </button>

          <ul class="detail-list" style="margin-top:28px">
            ${text.details.map((d) => `<li>${d}</li>`).join("")}
          </ul>
        </div>
      </div>
    `;

    root.querySelectorAll("[data-thumb]").forEach((thumb) => {
      thumb.addEventListener("click", () => {
        document.getElementById("main-image").src = thumb.src;
        root.querySelectorAll("[data-thumb]").forEach((th) => th.classList.remove("active"));
        thumb.classList.add("active");
      });
    });

    const qtyInput = document.getElementById("qty-input");
    document.getElementById("qty-minus").addEventListener("click", () => {
      qtyInput.value = Math.max(1, parseInt(qtyInput.value, 10) - 1);
    });
    document.getElementById("qty-plus").addEventListener("click", () => {
      qtyInput.value = parseInt(qtyInput.value, 10) + 1;
    });
    document.getElementById("add-form").addEventListener("submit", (e) => {
      e.preventDefault();
      addToCart(product.id, parseInt(qtyInput.value, 10));
      document.getElementById("form-msg").textContent = t("added_to_cart_msg");
      showToast(t("added_to_cart", { name: product.name }));
    });

    document.getElementById("wishlist-large-btn").addEventListener("click", (e) => {
      const active = toggleWishlist(product.id);
      e.currentTarget.classList.toggle("active", active);
      document.getElementById("wishlist-large-label").textContent = active ? t("wishlist_on_list") : t("wishlist_add");
      showToast(active ? t("wishlist_added") : t("wishlist_removed"));
    });

    const related = PRODUCTS.filter((p) => p.category === product.category && p.id !== product.id).slice(0, 4);
    const fallback = related.length ? related : PRODUCTS.filter((p) => p.id !== product.id).slice(0, 4);
    document.getElementById("related-grid").innerHTML = fallback.map(renderProductCard).join("");

    addRecentlyViewed(product.id);
    const recentIds = getRecentlyViewed().filter((id) => id !== product.id);
    if (recentIds.length) {
      const recentProducts = recentIds.map(getProductById).filter(Boolean).slice(0, 4);
      if (recentProducts.length) {
        document.getElementById("recent-grid").innerHTML = recentProducts.map(renderProductCard).join("");
        document.getElementById("recent-section").hidden = false;
      }
    }
    updateWishlistBadge();
  }
</script>
</body>
</html>
