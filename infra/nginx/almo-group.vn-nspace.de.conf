# Fertiger Server-Block fuer almo-group.vn-nspace.de.
# Wird manuell in /etc/nginx/sites-available/default eingefuegt (nach dem letzten
# bestehenden Server-Block), NICHT als eigene Datei unter sites-enabled - alle
# Bloecke liegen dort in einer Datei, siehe Spec.
#
# Danach: nginx -t && systemctl reload nginx
# Anschliessend: certbot --nginx -d almo-group.vn-nspace.de
# certbot baut danach automatisch einen zweiten 443-Block und macht aus diesem
# Block einen Redirect auf https - wie bei den anderen Subdomains.

server {
    listen 80;
    server_name almo-group.vn-nspace.de;

    location / {
        proxy_pass http://127.0.0.1:8093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8094;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
